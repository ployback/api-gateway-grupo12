spring.application.name=api-gateway-grupo12
server.port=8070

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.routes[0].id=solicitud-route
spring.cloud.gateway.routes[0].uri=lb://SOLICITUD-SERVICE-GRUPO12
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/solicitudes/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=2

spring.cloud.gateway.routes[1].id=evaluacion-route
spring.cloud.gateway.routes[1].uri=lb://EVALUACION-SERVICE-GRUPO12
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/evaluaciones/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=2
